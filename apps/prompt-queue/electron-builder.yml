appId: com.scottmallinson.promptqueue
productName: Prompt Queue
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
artifactName: ${name}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # Electron 43 is the last major that runs on macOS 12 (Monterey).
  minimumSystemVersion: '12.0'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  # Ship separate x64 and arm64 installers rather than one combined installer.
  buildUniversalInstaller: false
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-win-portable.${ext}
linux:
  target: [AppImage]
  category: Development
