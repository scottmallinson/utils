appId: com.scottmallinson.pdfmaker
productName: PDF Maker
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
artifactName: ${name}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-win-portable.${ext}
linux:
  target: [AppImage]
  category: Office
